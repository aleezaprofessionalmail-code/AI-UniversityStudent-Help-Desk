<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Tickets - SMIU AI Student Help Desk</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-smiu px-3">
    <div class="container-fluid">

      <a class="navbar-brand navbar-brand-flex" href="/dashboard">
        <img src="/static/images/smiu_logo.png" alt="SMIU Logo" class="navbar-logo">

        <span class="navbar-brand-text">
          <span class="brand-title">SMIU AI Student Help Desk</span>
          <span class="brand-sub">Sindh Madressatul Islam University</span>
        </span>
      </a>

      <button class="navbar-toggler" type="button"
              data-bs-toggle="collapse"
              data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a class="nav-link" href="/dashboard">Home</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/chatbot">Chatbot</a>
          </li>

          <li class="nav-item">
            <a class="nav-link active" href="/tickets">Tickets</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="/logout">Logout</a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- Main Content -->
  <div class="container py-5">

    <h3 class="mb-1">My Tickets</h3>

    <p class="text-muted mb-4">
      Track the status of all tickets you've raised.
    </p>

    <div class="card border-0 shadow-sm">

      <div class="card-body p-0">

        <table class="table table-hover align-middle mb-0">

          <thead class="table-light">
            <tr>
              <th>Ticket ID</th>
              <th>Department</th>
              <th>Priority</th>
              <th>Status</th>
              <th>Created</th>
            </tr>
          </thead>

          <!-- Dynamic Tickets -->
          <tbody id="ticketTable">
          </tbody>

        </table>

      </div>

    </div>

  </div>

  <div class="smiu-footer">
    SMIU AI Student Help Desk &copy; 2026
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
async function loadTickets() {

  try {
    const response = await fetch("/api/tickets");
    const tickets = await response.json();

    const table = document.getElementById("ticketTable");
    table.innerHTML = "";

    tickets.forEach(ticket => {

      // Priority styling
      let priorityClass = "";

      if (ticket.priority === "High") {
        priorityClass = "priority-high";
      } else if (ticket.priority === "Medium") {
        priorityClass = "priority-medium";
      } else {
        priorityClass = "priority-low";
      }

      // Status styling
      let statusBadge = "";

      if (ticket.status === "Open") {
        statusBadge = "badge-open";
      } else if (ticket.status === "In Progress") {
        statusBadge = "badge-progress";
      } else {
        statusBadge = "badge-resolved";
      }

      // Ticket ID safe handling
      const ticketID = ticket.ticket_id
        ? ticket.ticket_id
        : `SMIU-2026-${String(ticket.id).padStart(4, '0')}`;

      table.innerHTML += `
        <tr>

          <td>${ticketID}</td>

          <td>${ticket.department || "-"}</td>

          <td>
            <span class="${priorityClass}">
              ${ticket.priority || "-"}
            </span>
          </td>

          <td>
            <span class="badge ${statusBadge}">
              ${ticket.status || "Open"}
            </span>
          </td>

          <td>${ticket.created_date || "-"}</td>

        </tr>
      `;
    });

  } catch (error) {
    console.error("Error loading tickets:", error);
  }
}

loadTickets();
</script>

</body>
</html>
