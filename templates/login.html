<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SMIU AI Student Help Desk</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: #f4f6f9;
      font-family: Arial, sans-serif;
    }

    .login-wrapper {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .login-card {
      width: 420px;
      border: none;
      border-radius: 12px;
      box-shadow: 0px 0px 20px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }

    .card-header {
      background: #0d6efd;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .login-logo {
      width: 60px;
      margin-bottom: 10px;
    }

    .btn-smiu {
      background: #0d6efd;
      color: white;
    }

    .btn-smiu:hover {
      background: #0b5ed7;
      color: white;
    }

    .signup-link {
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="login-wrapper">
    <div class="card login-card">

      <!-- HEADER -->
      <div class="card-header">
        <img src="../static/images/smiu_logo.png" alt="SMIU Logo" class="login-logo">
        <h5 class="mb-0">SMIU AI Student Help Desk</h5>
        <small class="opacity-75">Sindh Madressatul Islam University</small>
      </div>

      <!-- BODY -->
      <div class="card-body p-4">

        <form id="loginForm">

          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" id="studentId" class="form-control"
              placeholder="e.g. admin or student" required>
          </div>

          <div class="mb-2">
            <label class="form-label">Password</label>
            <input type="password" id="password" class="form-control"
              placeholder="Enter password" required>
          </div>

          <div id="loginError" class="text-danger small mb-2 d-none">
            Invalid Username or Password.
          </div>

          <button type="submit" class="btn btn-smiu w-100 py-2">
            Login
          </button>
        </form>

        <p class="text-center text-muted small mt-3 mb-0">
          Demo: <strong>admin/123</strong> or <strong>student/123</strong>
        </p>

        <hr>

        <p class="text-center text-muted small mb-0">
          Don't have an account?
          <a href="/signup" class="signup-link">Sign Up</a>
        </p>

      </div>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {

      const loginForm = document.getElementById("loginForm");

      loginForm.addEventListener("submit", async function (e) {
        e.preventDefault();

        const username = document.getElementById("studentId").value.trim();
        const password = document.getElementById("password").value.trim();
        const errorBox = document.getElementById("loginError");

        errorBox.classList.add("d-none");

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username,
              password: password
            })
          });

          const data = await response.json();

          console.log(data);

          if (data.success) {

            if (data.role === "admin") {
              window.location.href = "/admin";
            } else {
              window.location.href = "/dashboard";
            }

          } else {
            errorBox.classList.remove("d-none");
          }

        } catch (error) {
          console.error(error);
          alert("Server Connection Error");
        }

      });

    });

    fetch("/login", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        username,
        password
    })
})
.then(res => res.json())
.then(data => {

    if(data.success){
        window.location.href = data.redirect; // 🔥 important
    } else {
        alert("Invalid login");
    }

});
  </script>

</body>

</html>
