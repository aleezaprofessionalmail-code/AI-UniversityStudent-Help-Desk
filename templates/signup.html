<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - SMIU AI Student Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
  <style>
    /* ---- Signup-specific styles (extends existing theme) ---- */
    .signup-wrapper {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
      background: radial-gradient(circle at top left, var(--smiu-green-light), var(--smiu-green));
    }

    .signup-card {
      border: none;
      border-radius: var(--radius);
      box-shadow: 0 20px 45px rgba(11, 45, 77, 0.35);
      overflow: hidden;
      max-width: 480px;
      width: 100%;
      animation: cardFadeIn 0.45s ease both;
    }

    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .signup-card .card-header {
      background: var(--smiu-green);
      color: #fff;
      text-align: center;
      padding: 1.75rem 1.5rem 1.25rem;
      border-bottom: 3px solid var(--smiu-gold);
    }

    /* ---- Role Toggle ---- */
    .role-toggle {
      display: flex;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--smiu-green);
      margin-bottom: 1.5rem;
    }

    .role-btn {
      flex: 1;
      padding: .6rem 1rem;
      border: none;
      background: #fff;
      color: var(--smiu-green);
      font-family: 'Poppins', sans-serif;
      font-weight: 600;
      font-size: .9rem;
      cursor: pointer;
      transition: background .2s ease, color .2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .4rem;
    }

    .role-btn.active {
      background: var(--smiu-green);
      color: #fff;
    }

    .role-btn:not(.active):hover {
      background: rgba(14, 61, 34, 0.07);
    }

    /* ---- Form fields ---- */
    .form-control:focus {
      border-color: var(--smiu-green-light);
      box-shadow: 0 0 0 .2rem rgba(26, 107, 61, 0.18);
    }

    .form-label {
      font-weight: 500;
      font-size: .88rem;
      color: var(--smiu-text);
    }

    /* ---- Field group slide transition ---- */
    .field-group {
      overflow: hidden;
      transition: max-height 0.35s ease, opacity 0.3s ease;
    }

    .field-group.hidden {
      max-height: 0;
      opacity: 0;
      pointer-events: none;
    }

    .field-group.visible {
      max-height: 600px;
      opacity: 1;
    }

    /* ---- Validation feedback ---- */
    .form-control.is-invalid {
      border-color: #dc3545;
    }

    .invalid-msg {
      display: none;
      color: #dc3545;
      font-size: .8rem;
      margin-top: .25rem;
    }

    .form-control.is-invalid + .invalid-msg,
    .form-control.is-invalid ~ .invalid-msg {
      display: block;
    }

    /* ---- Password toggle eye ---- */
    .input-group .btn-eye {
      border: 1px solid #ced4da;
      border-left: none;
      background: #fff;
      color: var(--smiu-muted);
      transition: color .2s;
    }

    .input-group .btn-eye:hover {
      color: var(--smiu-green);
    }

    /* ---- Sign Up button ---- */
    .btn-signup {
      background: linear-gradient(135deg, var(--smiu-green), var(--smiu-green-light));
      border: none;
      color: #fff;
      font-weight: 600;
      font-family: 'Poppins', sans-serif;
      letter-spacing: .02em;
      transition: opacity .2s ease, transform .15s ease;
    }

    .btn-signup:hover {
      opacity: .9;
      color: var(--smiu-gold);
      transform: translateY(-1px);
    }

    /* ---- Role badge in header ---- */
    .role-badge {
      display: inline-block;
      background: rgba(201, 155, 63, 0.2);
      border: 1px solid var(--smiu-gold);
      color: var(--smiu-gold);
      border-radius: 20px;
      font-size: .72rem;
      font-weight: 600;
      padding: .15rem .7rem;
      margin-top: .4rem;
      font-family: 'Poppins', sans-serif;
      letter-spacing: .03em;
      transition: opacity .25s;
    }

    .signup-link-back {
      color: var(--smiu-green);
      font-weight: 600;
      text-decoration: none;
      transition: color .15s;
    }

    .signup-link-back:hover {
      color: var(--smiu-green-light);
      text-decoration: underline;
    }

    /* ---- Success overlay ---- */
    .success-overlay {
      display: none;
      text-align: center;
      padding: 2rem 1rem;
      animation: cardFadeIn 0.4s ease both;
    }

    .success-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--smiu-green), var(--smiu-green-light));
      color: #fff;
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }
  </style>
</head>
<body>

  <div class="signup-wrapper">
    <div class="card signup-card">

      <!-- Header -->
      <div class="card-header">
        <img src="../static/images/smiu_logo.png" alt="SMIU Logo" class="login-logo">
        <h5 class="mb-1">Create Your Account</h5>
        <small class="text-light opacity-75">Sindh Madressatul Islam University</small><br>
        <span class="role-badge" id="headerRoleBadge">Student Account</span>
      </div>

      <div class="card-body p-4">

        <!-- Role Toggle -->
        <div class="role-toggle" role="group" aria-label="Account type">
          <button type="button" class="role-btn active" id="btnStudent" onclick="switchRole('student')">
            <i class="bi bi-mortarboard-fill"></i> Student
          </button>
          <button type="button" class="role-btn" id="btnAdmin" onclick="switchRole('admin')">
            <i class="bi bi-shield-lock-fill"></i> Admin
          </button>
        </div>

        <!-- Signup Form -->
        <form id="signupForm" method="POST" action="/signup">

  <!-- LOGO DESIGN SAME RAHEGA (CARD HEADER AS IT IS) -->

  <!-- USERNAME -->
  <div class="mb-3">
    <label class="form-label">Username</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-person"></i></span>
      <input type="text" name="username" class="form-control" placeholder="Enter username" required>
    </div>
  </div>

  <!-- PASSWORD -->
  <div class="mb-3">
    <label class="form-label">Password</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-lock"></i></span>
      <input type="password" name="password" class="form-control" placeholder="Create password" required>
    </div>
  </div>

  <!-- ROLE -->
  <div class="mb-3">
    <label class="form-label">Role</label>
    <div class="input-group">
      <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
      <select name="role" class="form-control" required>
        <option value="student">Student</option>
        <option value="admin">Admin</option>
      </select>
    </div>
  </div>

  <!-- SUBMIT -->
  <button type="submit" class="btn btn-signup w-100 py-2">
    <i class="bi bi-person-plus-fill me-1"></i> Create Account
  </button>

</form>

        <!-- Success state (shown after submit) -->
        <div class="success-overlay" id="successOverlay">
          <div class="success-icon"><i class="bi bi-check-lg"></i></div>
          <h5 class="fw-bold" id="successTitle">Account Created!</h5>
          <p class="text-muted small" id="successMsg">Redirecting you to your portal…</p>
          <div class="spinner-border spinner-border-sm text-success mt-1" role="status"></div>
        </div>

        <hr class="my-3">
        <p class="text-center text-muted small mb-0">
          Already have an account?
          <a href="login.html" class="signup-link-back">Log In</a>
        </p>

      </div><!-- /card-body -->
    </div><!-- /signup-card -->
  </div><!-- /signup-wrapper -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    /* ========================================================
       SMIU Signup Page JS
       - Role switching (Student / Admin)
       - Form validation
       - Dummy submit handler (replace with API call later)
    ======================================================== */

    let currentRole = 'student';

  


    /* ---------- Validation Helpers ---------- */
    function setInvalid(el, errId, msg) {
      el.classList.add('is-invalid');
      if (errId && msg) document.getElementById(errId).textContent = msg;
      return false;
    }

    function setValid(el) {
      el.classList.remove('is-invalid');
    }

    function clearValidation() {
      document.querySelectorAll('.form-control').forEach(el => el.classList.remove('is-invalid'));
      document.getElementById('globalError').classList.add('d-none');
    }

    function isValidEmail(email) {
      return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
    }



    /* ---------- Form Submit ---------- */
document.getElementById('signupForm').addEventListener('submit', function (e) {

    const isValid =
      currentRole === 'student'
      ? validateStudentForm()
      : validateAdminForm();

    if (!isValid) {
        e.preventDefault();
        return;
    }

    if(currentRole === "student")
    {
        document.getElementById("usernameInput").value =
        document.getElementById("s_rollNo").value;

        document.getElementById("passwordInput").value =
        document.getElementById("s_password").value;
    }
    else
    {
        document.getElementById("usernameInput").value =
        document.getElementById("a_adminId").value;

        document.getElementById("passwordInput").value =
        document.getElementById("a_password").value;
    }

});
  </script>
</body>
</html>
