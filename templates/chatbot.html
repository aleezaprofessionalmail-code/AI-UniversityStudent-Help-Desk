<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Assistant - SMIU AI Student Help Desk</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-smiu px-3">
    <div class="container-fluid">
      <a class="navbar-brand navbar-brand-flex" href="/dashboard"> </a>
        <img src="../static/images/smiu_logo.png" alt="SMIU Logo" class="navbar-logo">
        <span class="navbar-brand-text">
          <span class="brand-title">SMIU AI Student Help Desk</span>
          <span class="brand-sub">Sindh Madressatul Islam University</span>
        </span>
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="/dashboard">Home</a></li>
          <li class="nav-item"><a class="nav-link active" href="/chatbot">Chatbot</a></li>
          <li class="nav-item"><a class="nav-link" href="/tickets">Tickets</a></li>
          <li class="nav-item"><a class="nav-link" href="/login">Logout</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="chat-shell">
      <div class="chat-header">
        <i class="bi bi-robot me-2"></i>SMIU AI Assistant
      </div>

      <div class="chat-body" id="chatBody">
        <div class="chat-bubble bot">
          Hi! I'm the SMIU AI Assistant. Tell me what issue you're facing and I'll try to help.
        </div>
      </div>

      <div class="chat-input-bar">
        <form id="chatForm" class="d-flex gap-2">
          <input type="text" id="chatInput" class="form-control" placeholder="Type your issue here..." autocomplete="off" required>
          <button type="submit" class="btn btn-smiu px-4">Send</button>
        </form>
      </div>
    </div>
  </div>

  <div class="smiu-footer">SMIU AI Student Help Desk &copy; 2026</div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../static/js/chatbot.js"></script>
</body>
</html>
